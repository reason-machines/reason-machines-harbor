# Publishes to PyPI when a GitHub release is published. Needs a PyPI trusted
# publisher for this repository and workflow, with environment "pypi".
name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
